spring:
  application:
    name: notifications-service-test
  
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications_db_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications-service-test-group
      auto-offset-reset: earliest
      enable-auto-commit: true

server:
  port: 0

logging:
  level:
    root: WARN
    com.br.hospital: DEBUG
