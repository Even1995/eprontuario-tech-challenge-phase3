spring:
  application:
    name: history-service
  
  server:
    port: 8081
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
  
  kafka:
    bootstrap-servers: localhost:9092
  
  graphql:
    graphiql:
      enabled: true
    path: /graphql

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    root: WARN
    com.br.hospital: DEBUG
