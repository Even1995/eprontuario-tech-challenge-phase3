spring:
  application:
    name: auth-common

server:
  port: 9090

jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production-environment-variable}
  expiration: 3600000

logging:
  level:
    com.br.eprontuario: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
